<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリーカレンダー | 願望現実化チェック</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1D9E75">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タイムカレンダー">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg:#FAFAF9;--bg-card:#fff;--bg-sur:#F1EFE8;
  --text:#1A1A18;--muted:#5F5E5A;
  --bd:rgba(0,0,0,0.11);--bd2:rgba(0,0,0,0.2);
  --teal:#1D9E75;--r:8px;--rl:12px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1A1A18;--bg-card:#2C2C2A;--bg-sur:#232320;--text:#EDEDE8;--muted:#888780;--bd:rgba(255,255,255,0.09);--bd2:rgba(255,255,255,0.18)}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.layout{display:flex;min-height:100vh}
.main{flex:1;padding:1.25rem 1.1rem;overflow-y:auto;min-width:0}
.sidebar{width:400px;flex-shrink:0;background:var(--bg-card);border-left:0.5px solid var(--bd);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* sidebar parts */
.sb-head{padding:.8rem 1rem .6rem;border-bottom:.5px solid var(--bd);flex-shrink:0}
.sb-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px}
.sb-sub{font-size:11px;color:var(--muted);margin-top:1px}
.day-bar{display:flex;align-items:center;padding:.5rem 1rem;background:var(--bg-sur);border-bottom:.5px solid var(--bd);flex-shrink:0;min-height:36px}
.day-bar-date{font-size:13px;font-weight:600;color:var(--teal);display:flex;align-items:center;gap:5px}
.today-chip{font-size:10px;background:var(--teal);color:#fff;border-radius:4px;padding:1px 6px}

/* カテゴリセレクター */
.cat-sel{padding:.6rem .8rem;border-bottom:.5px solid var(--bd);flex-shrink:0;display:none}
.cat-sel-label{font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:500}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.cat-btn{padding:4px 2px;border-radius:5px;border:1.5px solid transparent;font-size:9px;font-weight:500;line-height:1.2;cursor:pointer;font-family:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.cat-btn i{font-size:13px}
.cat-btn.active{border-color:currentColor;box-shadow:0 0 0 2px rgba(0,0,0,0.06)}
.clr-btn{padding:4px 7px;border-radius:5px;border:.5px solid var(--bd2);background:transparent;color:var(--muted);font-size:10px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:3px;margin-top:4px}
.clr-btn.active{background:var(--bg-sur)}

/* タイムサマリー */
.t-sum{display:flex;flex-wrap:wrap;gap:3px;padding:5px 1rem;border-bottom:.5px solid var(--bd);min-height:30px;flex-shrink:0;display:none}
.t-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500;white-space:nowrap}

/* タイムライン（15分刻み） */
.pscroll{flex:1;overflow-y:auto;-webkit-user-select:none;user-select:none}
.tl-slot{display:flex;align-items:stretch;height:17px;cursor:pointer;border-bottom:.5px dotted var(--bd)}
.tl-slot:hover{background:var(--bg-sur)}
.tl-slot.h-start{border-top:.5px solid var(--bd2)}
.tl-slot.half{border-bottom-style:dashed}
.tl-time{width:46px;flex-shrink:0;font-size:10px;color:var(--muted);padding:0 5px 0 10px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.tl-time.q{font-size:8px;opacity:.45}
.tl-block{flex:1;display:flex;align-items:center;padding:0 8px;gap:4px;border-radius:3px;margin:1px 6px 1px 2px}
.cat-name{font-size:10px;font-weight:500;white-space:nowrap}
.cat-note-txt{font-size:9px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.note-row{padding:3px 8px 4px 48px;border-bottom:.5px solid var(--bd);background:var(--bg-sur)}
.note-inp{width:100%;height:24px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg-card);color:var(--text);padding:0 7px;font-size:11px;font-family:inherit}
.note-inp:focus{outline:none;border-color:var(--teal)}

/* 食事ログ */
.meal-sec{border-top:.5px solid var(--bd);padding:.65rem 1rem;flex-shrink:0}
.meal-row{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.meal-lbl{font-size:10px;color:var(--muted);width:34px;flex-shrink:0;display:flex;align-items:center;gap:3px}
.meal-inp{flex:1;height:24px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:0 7px;font-size:11px;font-family:inherit;min-width:0}
.meal-inp:focus{outline:none;border-color:var(--teal)}

/* 支出 */
.money-sec{border-top:.5px solid var(--bd);padding:.65rem 1rem;flex-shrink:0}
.sec-label{font-size:11px;font-weight:500;color:var(--muted);margin-bottom:7px;display:flex;align-items:center;gap:4px}
.sec-label .tot{margin-left:auto;color:var(--teal);font-weight:600;font-size:12px}
.exp-row{display:flex;align-items:center;gap:4px;margin-bottom:4px}
.exp-name{flex:1;height:24px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:0 6px;font-size:11px;font-family:inherit;min-width:0}
.exp-amt{width:74px;height:24px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:0 5px;font-size:11px;text-align:right;font-family:inherit;flex-shrink:0}
.exp-cat{width:104px;height:24px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:0 6px;font-size:10px;font-family:inherit;flex-shrink:0;min-width:0}
.exp-name:focus,.exp-amt:focus,.exp-cat:focus{outline:none;border-color:var(--teal)}
.exp-del{width:20px;height:24px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;flex-shrink:0;font-family:inherit}
.exp-del:hover{color:#A32D2D}
.add-btn{width:100%;padding:5px;margin-top:3px;background:transparent;border:.5px dashed var(--bd2);border-radius:var(--r);font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px}
.add-btn:hover{background:var(--bg-sur)}
.mv-wrap{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.mv-chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:500;white-space:nowrap;background:var(--bg-sur);color:var(--text)}

/* メモ */
.memo-sec{padding:.6rem 1rem;border-top:.5px solid var(--bd);flex-shrink:0}
.memo-ta{width:100%;height:38px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg);color:var(--text);padding:5px 8px;font-size:12px;font-family:inherit;resize:none}
.memo-ta:focus{outline:none;border-color:var(--teal)}
.mood-row{display:flex;align-items:center;gap:7px;margin-top:6px}
.mood-lbl{font-size:11px;color:var(--muted);flex-shrink:0}
.mood-row input[type=range]{flex:1;accent-color:var(--teal)}
.mood-val{font-size:12px;font-weight:600;min-width:32px;text-align:right;color:var(--teal)}

/* 保存 */
.save-area{padding:.5rem 1rem .85rem;flex-shrink:0}
.save-btn{width:100%;padding:9px;background:var(--teal);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:opacity .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.save-btn:hover{opacity:.86}
.save-btn.ok{background:#0F6E56}
.link-btn{width:100%;padding:6px;margin-top:5px;background:transparent;border:.5px solid var(--bd2);border-radius:var(--r);font-size:11px;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px}
.link-btn:hover{background:var(--bg-sur)}
.day-empty{padding:3rem 1rem;text-align:center;color:var(--muted);font-size:13px}
.day-empty i{font-size:32px;display:block;margin-bottom:10px;opacity:.3}

/* カレンダー */
.cal-hd{display:flex;align-items:center;gap:8px;margin-bottom:1rem}
.cal-title{font-size:18px;font-weight:600;flex:1}
.nav-btn{border:.5px solid var(--bd2);background:var(--bg-card);border-radius:var(--r);width:30px;height:30px;cursor:pointer;font-size:14px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:var(--bg-sur)}
.td-btn{border:.5px solid var(--bd2);background:var(--bg-card);border-radius:var(--r);padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:3px}
.cal-dow{text-align:center;font-size:11px;font-weight:500;color:var(--muted);padding:3px 0}
.cal-dow.sun{color:#E24B4A}.cal-dow.sat{color:#185FA5}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;border:.5px solid var(--bd);border-radius:var(--rl);background:var(--bg-card);padding:5px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px;transition:border-color .1s}
.cal-cell:hover{border-color:var(--teal)}
.cal-cell.om{opacity:.3;cursor:default}.cal-cell.om:hover{border-color:var(--bd)}
.cal-cell.td{border:1.5px solid var(--teal)}
.cal-cell.sel{background:#E1F5EE;border:1.5px solid var(--teal)}
.cal-date{font-size:12px;font-weight:500;line-height:1}
.cal-cell.td .cal-date{color:#fff;background:var(--teal);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px}
.cal-cell.sun .cal-date{color:#E24B4A}.cal-cell.sat .cal-date{color:#185FA5}.cal-cell.td .cal-date{color:#fff}
.cal-bar-row{display:flex;gap:1px;height:4px;border-radius:2px;overflow:hidden;margin-top:auto}
.cal-bar-seg{height:100%}
.cal-money{font-size:9px;color:var(--muted);display:flex;align-items:center;gap:3px}
.cal-meal{font-size:9px;color:#BA7517}
.wk-sum{margin-top:1rem;border:.5px solid var(--bd);border-radius:var(--rl);background:var(--bg-card);padding:.85rem 1rem}
.wk-title{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.wk-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.wk-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.wk-lbl{font-size:10px;color:var(--muted);width:78px;flex-shrink:0}
.wk-track{flex:1;height:6px;background:var(--bg-sur);border-radius:3px;overflow:hidden}
.wk-fill{height:100%;border-radius:3px}
.wk-val{font-size:10px;color:var(--muted);min-width:78px;text-align:right;flex-shrink:0}


/* クラウド同期 */
.sync-bar{display:flex;align-items:center;gap:6px;padding:.45rem 1rem;border-bottom:.5px solid var(--bd);flex-shrink:0;font-size:11px;color:var(--muted)}
.sy-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sy-dot.ok{background:#1D9E75}
.sy-dot.warn{background:#D97706}
.sy-dot.err{background:#A32D2D}
.sy-status-text{flex:1}
.sync-toggle{border:.5px solid var(--bd2);background:transparent;border-radius:6px;padding:3px 8px;font-size:10px;color:var(--muted);cursor:pointer;font-family:inherit}
.sync-toggle:hover{background:var(--bg-sur)}
.sync-panel{padding:.6rem 1rem .7rem;border-bottom:.5px solid var(--bd);flex-shrink:0;background:var(--bg-sur)}
.sy-inp{width:100%;height:28px;border:.5px solid var(--bd2);border-radius:var(--r);background:var(--bg-card);color:var(--text);padding:0 8px;font-size:12px;font-family:inherit;margin-bottom:5px}
.sy-inp:focus{outline:none;border-color:var(--teal)}
.sy-row{display:flex;gap:6px}
.sy-btn{flex:1;padding:6px;border:none;border-radius:var(--r);background:var(--teal);color:#fff;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit}
.sy-btn.ghost{background:transparent;border:.5px solid var(--bd2);color:var(--text)}
.sy-btn:hover{opacity:.88}
.sy-btn:disabled{opacity:.5;cursor:default}
.sy-msg{font-size:10px;color:var(--muted);margin-top:6px;min-height:12px;line-height:1.5}
.sy-msg.err{color:#A32D2D}
.sy-msg.ok{color:#0F6E56}
.sy-signout{width:100%;margin-top:6px;padding:5px;background:transparent;border:.5px solid var(--bd2);border-radius:var(--r);font-size:10px;color:var(--muted);cursor:pointer;font-family:inherit}
.sy-signout:hover{background:var(--bg-card)}
@media(max-width:720px){.layout{flex-direction:column-reverse}.sidebar{width:100%;height:auto;position:static}.cat-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="cal-hd">
      <button class="nav-btn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
      <div class="cal-title" id="cal-title"></div>
      <button class="nav-btn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
      <button class="td-btn" onclick="goToday()">今日</button>
    </div>
    <div class="cal-dow-row">
      <div class="cal-dow sun">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div>
      <div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow sat">土</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="wk-sum"><div class="wk-title"><i class="ti ti-chart-bar"></i> 今週の集計</div><div id="wk-bars"></div></div>
  </div>

  <div class="sidebar">
    <div class="sb-head">
      <div class="sb-title"><i class="ti ti-clock-24" style="color:var(--teal)"></i> 24時間タイムライン（15分刻み）</div>
      <div class="sb-sub">① カテゴリ選択 → ② 時間帯をクリック／ドラッグで一括塗り</div>
    </div>
    <div class="sync-bar" id="sync-bar">
      <span class="sy-dot" id="sy-dot"></span>
      <span class="sy-status-text" id="sy-status-text">読み込み中…</span>
      <button class="sync-toggle" id="sync-toggle" onclick="toggleSyncPanel()">同期設定</button>
    </div>
    <div class="sync-panel" id="sync-panel" style="display:none">
      <input class="sy-inp" id="sy-email" type="email" placeholder="メールアドレス" autocomplete="username">
      <input class="sy-inp" id="sy-pw" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password">
      <div class="sy-row">
        <button class="sy-btn" id="sy-signin-btn" onclick="doSignIn()">ログイン</button>
        <button class="sy-btn ghost" id="sy-signup-btn" onclick="doSignUp()">新規登録</button>
      </div>
      <div class="sy-msg" id="sy-msg"></div>
      <button class="sy-signout" id="sy-signout" style="display:none" onclick="doSignOut()">ログアウト</button>
    </div>
    <div class="day-bar" id="day-bar">
      <span style="font-size:12px;color:var(--muted)"><i class="ti ti-calendar-plus" style="font-size:12px"></i> カレンダーの日付をクリック</span>
    </div>
    <div class="cat-sel" id="cat-sel">
      <div class="cat-sel-label">▼ カテゴリを選んでから時間帯をクリック（ドラッグで連続入力）</div>
      <div class="cat-grid" id="cat-grid"></div>
      <button class="clr-btn" id="clr-btn" onclick="setActiveCat(null)"><i class="ti ti-eraser" style="font-size:11px"></i> クリアモード（選択中スロットを削除）</button>
    </div>
    <div class="t-sum" id="t-sum"></div>
    <div class="pscroll" id="pscroll">
      <div class="day-empty" id="tl-empty"><i class="ti ti-calendar-plus"></i>日付を選ぶと<br>15分刻みの<br>タイムラインが表示されます</div>
      <div id="tl-list"></div>
      <div id="forms"></div>
    </div>
  </div>
</div>

<script>
const CATS = [
  {id:'sleep',   label:'睡眠',                  short:'睡眠',       color:'#534AB7',bg:'#EEEDFE',tc:'#26215C',icon:'ti-moon'},
  {id:'meal',    label:'食事',                  short:'食事',       color:'#BA7517',bg:'#FAEEDA',tc:'#412402',icon:'ti-coffee'},
  {id:'q2',      label:'第二象限の時間',          short:'第二象限',   color:'#1D9E75',bg:'#E1F5EE',tc:'#085041',icon:'ti-star'},
  {id:'chores',  label:'家事・プライベート所用',   short:'家事・所用', color:'#888780',bg:'#F1EFE8',tc:'#2C2C2A',icon:'ti-home'},
  {id:'self',    label:'自分時間（入浴等）',       short:'自分時間',   color:'#0EA5A5',bg:'#D6F2F2',tc:'#0A3D3D',icon:'ti-bath'},
  {id:'family',  label:'家族時間',               short:'家族時間',   color:'#D4537E',bg:'#FBEAF0',tc:'#4B1528',icon:'ti-heart'},
  {id:'network', label:'人脈拡大・営業活動',      short:'人脈・営業', color:'#185FA5',bg:'#E6F1FB',tc:'#042C53',icon:'ti-users'},
  {id:'travel',  label:'移動',                  short:'移動',       color:'#5F5E5A',bg:'#D3D1C7',tc:'#2C2C2A',icon:'ti-map-pin'},
  {id:'consult', label:'ご面談',                short:'ご面談',     color:'#D85A30',bg:'#FAECE7',tc:'#4A1B0C',icon:'ti-user'},
  {id:'admin',   label:'事務処理・タスク処理',    short:'事務・タスク',color:'#3B6D11',bg:'#EAF3DE',tc:'#173404',icon:'ti-file'},
  {id:'mtg',     label:'MTG等外せない予定',      short:'MTG等',     color:'#A32D2D',bg:'#FCEBEB',tc:'#501313',icon:'ti-calendar-event'},
  {id:'kmk',     label:'KMK（キッズマネーキッチン）',short:'KMK',     color:'#E0761B',bg:'#FDE8CF',tc:'#5A2E03',icon:'ti-school'},
  {id:'beauty',  label:'美容',                  short:'美容',       color:'#993556',bg:'#F4C0D1',tc:'#4B1528',icon:'ti-sparkles'},
  {id:'waste',   label:'無意味な時間',            short:'無意味',     color:'#B4B2A9',bg:'#F1EFE8',tc:'#444441',icon:'ti-clock'},
  {id:'bni',     label:'BNI',                   short:'BNI',        color:'#0F6E56',bg:'#9FE1CB',tc:'#04342C',icon:'ti-building-community'},
  {id:'achieve', label:'アチーブ',               short:'アチーブ',   color:'#7F77DD',bg:'#CECBF6',tc:'#26215C',icon:'ti-award'},
  {id:'exercise',label:'運動',                  short:'運動',       color:'#D97706',bg:'#FEF3C7',tc:'#78350F',icon:'ti-run'},
];
const CMAP = {};
CATS.forEach(c => { CMAP[c.id] = c; });

const SLOTS = 96;          // 24h × 4 = 15分刻み
const SLOT_H = 0.25;       // 1スロット = 0.25時間
const MEALS = [
  {id:'b', label:'朝食', icon:'ti-sunrise'},
  {id:'l', label:'昼食', icon:'ti-sun'},
  {id:'d', label:'夕食', icon:'ti-moon-stars'},
  {id:'s', label:'間食', icon:'ti-candy'},
];

const TODAY = new Date();
let vy = TODAY.getFullYear(), vm = TODAY.getMonth();
var selDate = null, activeCat = null, editSlot = null;

/* ── データ読み込み（旧30分データを15分へ自動移行） ── */
var DB = null;
try { DB = JSON.parse(localStorage.getItem('cal_v2') || 'null'); } catch(e) { DB = null; }
if (!DB) {
  let old = {};
  try { old = JSON.parse(localStorage.getItem('cal_v1') || '{}'); } catch(e) {}
  DB = {};
  Object.keys(old).forEach(k => {
    const o = old[k] || {};
    const ns = {};
    Object.keys(o.slots || {}).forEach(si => {
      const i = parseInt(si, 10);
      const s = o.slots[si];
      if (!s || !s.catId || isNaN(i)) return;
      ns[i*2]   = { catId: s.catId, note: s.note || '' };
      ns[i*2+1] = { catId: s.catId, note: '' };
    });
    const exps = [];
    Object.keys(o.money || {}).forEach(cid => {
      const v = parseFloat(o.money[cid]) || 0;
      if (v > 0) exps.push({ name: (CMAP[cid] ? CMAP[cid].short : cid), amount: v, catId: cid });
    });
    DB[k] = { slots: ns, expenses: exps, meals: {}, memo: o.memo || '', mood: (o.mood != null ? o.mood : 60) };
  });
  localStorage.setItem('cal_v2', JSON.stringify(DB));
}

function dk(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function slotTime(i){ return `${String(Math.floor(i/4)).padStart(2,'0')}:${String((i%4)*15).padStart(2,'0')}`; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function entry(key) {
  if (!DB[key]) DB[key] = {slots:{},expenses:[],meals:{},memo:'',mood:60};
  const e = DB[key];
  if (!e.slots) e.slots = {};
  if (!e.expenses) e.expenses = [];
  if (!e.meals) e.meals = {};
  return e;
}

function times(key) {
  const t = {}; CATS.forEach(c => t[c.id]=0);
  const e = DB[key]; if (!e || !e.slots) return t;
  Object.values(e.slots).forEach(s => { if(s&&s.catId) t[s.catId]=(t[s.catId]||0)+SLOT_H; });
  return t;
}

/* 支出は明細から集計 */
function moneyOf(key) {
  const m = {}; const e = DB[key];
  if (!e || !e.expenses) return m;
  e.expenses.forEach(x => {
    const v = parseFloat(x.amount) || 0;
    if (v > 0) m[x.catId] = (m[x.catId]||0) + v;
  });
  return m;
}
function moneyTotal(key){ return Object.values(moneyOf(key)).reduce((a,b)=>a+b,0); }
function catDisplay(v){ if(!v) return '未分類'; return CMAP[v] ? CMAP[v].short : v; }
function hasMeal(key){ const e=DB[key]; return !!(e&&e.meals&&MEALS.some(m=>(e.meals[m.id]||'').trim())); }

function weekDates(ds) {
  const d = new Date(ds+'T12:00:00');
  const dow = d.getDay();
  const mon = new Date(d); mon.setDate(d.getDate()-dow+(dow===0?-6:1));
  const r=[];
  for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);r.push(dk(dd.getFullYear(),dd.getMonth(),dd.getDate()));}
  return r;
}

/* ── カテゴリボタン ── */
function buildCatGrid() {
  document.getElementById('cat-grid').innerHTML = CATS.map(c =>
    `<button class="cat-btn" id="cb-${c.id}" style="background:${c.bg};color:${c.tc}" title="${esc(c.label)}"
      onclick="setActiveCat('${c.id}')">
      <i class="ti ${c.icon}"></i>${c.short}
    </button>`
  ).join('');
}

function setActiveCat(id) {
  activeCat = id;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  const clrBtn = document.getElementById('clr-btn');
  if (id) {
    const b = document.getElementById('cb-'+id);
    if (b) b.classList.add('active');
    if (clrBtn) clrBtn.classList.remove('active');
  } else {
    if (clrBtn) clrBtn.classList.add('active');
  }
}

/* ── スロット塗り（クリック＆ドラッグ） ── */
let dragging = false, dragMode = null;

function slotRowHTML(i) {
  const e = entry(selDate);
  const s = e.slots[i];
  const cat = s && s.catId ? CMAP[s.catId] : null;
  const isH = i % 4 === 0;
  const isHalf = i % 4 === 2;
  const timeLabel = isH ? slotTime(i) : `<span style="opacity:.5">:${String((i%4)*15).padStart(2,'0')}</span>`;
  const cls = 'tl-slot'+(isH?' h-start':'')+(isHalf?' half':'');
  if (cat) {
    return `<div class="${cls}" data-i="${i}">
      <div class="tl-time${isH?'':' q'}">${timeLabel}</div>
      <div class="tl-block" style="background:${cat.bg}">
        <span style="width:6px;height:6px;border-radius:50%;background:${cat.color};flex-shrink:0"></span>
        <span class="cat-name" style="color:${cat.tc}">${cat.short}</span>
        ${s.note ? `<span class="cat-note-txt" style="color:${cat.tc}">${esc(s.note)}</span>` : ''}
        <i class="ti ti-pencil" onclick="event.stopPropagation();clickNote(${i})" style="font-size:9px;color:${cat.tc};opacity:.5;margin-left:auto;flex-shrink:0;cursor:pointer"></i>
      </div>
    </div>`;
  }
  return `<div class="${cls}" data-i="${i}">
    <div class="tl-time${isH?'':' q'}">${timeLabel}</div>
    <div class="tl-block"></div>
  </div>`;
}

function repaintRow(i) {
  const list = document.getElementById('tl-list');
  const row = list.querySelector(`.tl-slot[data-i="${i}"]`);
  if (!row) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = slotRowHTML(i);
  row.replaceWith(tmp.firstElementChild);
}

function startPaint(i) {
  if (!selDate) return;
  const e = entry(selDate);
  dragging = true;
  dragMode = (activeCat === null || (e.slots[i] && e.slots[i].catId === activeCat)) ? 'erase' : 'paint';
  applyPaint(i);
}
function applyPaint(i) {
  const e = entry(selDate);
  if (dragMode === 'erase') delete e.slots[i];
  else e.slots[i] = { catId: activeCat, note: (e.slots[i] && e.slots[i].note) || '' };
  repaintRow(i);
}
function endPaint() {
  if (!dragging) return;
  dragging = false; dragMode = null;
  save(); renderSummary(); renderCal(); renderWeek(); renderMoneyView();
}

function bindPaint() {
  const list = document.getElementById('tl-list');
  list.addEventListener('mousedown', ev => {
    const row = ev.target.closest('.tl-slot'); if (!row) return;
    ev.preventDefault();
    startPaint(parseInt(row.dataset.i, 10));
  });
  list.addEventListener('mouseover', ev => {
    if (!dragging) return;
    const row = ev.target.closest('.tl-slot'); if (!row) return;
    applyPaint(parseInt(row.dataset.i, 10));
  });
  list.addEventListener('touchstart', ev => {
    const row = ev.target.closest('.tl-slot'); if (!row) return;
    startPaint(parseInt(row.dataset.i, 10));
  }, {passive:true});
  list.addEventListener('touchmove', ev => {
    if (!dragging) return;
    const t = ev.touches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    const row = el && el.closest ? el.closest('.tl-slot') : null;
    if (row) { ev.preventDefault(); applyPaint(parseInt(row.dataset.i, 10)); }
  }, {passive:false});
  document.addEventListener('mouseup', endPaint);
  document.addEventListener('touchend', endPaint);
}

function clickNote(i) {
  editSlot = (editSlot === i) ? null : i;
  renderTimeline();
  const inp = document.querySelector('.note-inp');
  if (inp) inp.focus();
}
function updateNote(i, val) {
  if (!selDate) return;
  const e = entry(selDate);
  if (e.slots[i]) e.slots[i].note = val;
  save();
}

/* ── 食事ログ ── */
function updMeal(id, val) {
  if (!selDate) return;
  entry(selDate).meals[id] = val;
  save(); renderCal();
}

/* ── 支出明細 ── */
function addExp() {
  if (!selDate) return;
  entry(selDate).expenses.push({name:'', amount:'', catId:'meal'});
  save(); renderExpList();
  const rows = document.querySelectorAll('.exp-name');
  if (rows.length) rows[rows.length-1].focus();
}
function updExp(idx, field, val) {
  if (!selDate) return;
  const e = entry(selDate);
  if (!e.expenses[idx]) return;
  e.expenses[idx][field] = (field === 'amount') ? val : val;
  save(); renderExpTotal(); renderMoneyView(); renderCal(); renderWeek();
}
function delExp(idx) {
  if (!selDate) return;
  entry(selDate).expenses.splice(idx, 1);
  save(); renderExpList(); renderMoneyView(); renderCal(); renderWeek();
}
function renderExpList() {
  const e = entry(selDate);
  document.getElementById('exp-list').innerHTML = e.expenses.map((x,idx) =>
    `<div class="exp-row">
      <input class="exp-name" type="text" placeholder="何に使った？" value="${esc(x.name)}" oninput="updExp(${idx},'name',this.value)">
      <input class="exp-amt" type="number" min="0" placeholder="0" value="${x.amount===''||x.amount==null?'':x.amount}" oninput="updExp(${idx},'amount',this.value)">
      <input class="exp-cat" type="text" list="exp-cat-list" placeholder="カテゴリ" value="${esc(catDisplay(x.catId))}" oninput="updExp(${idx},'catId',this.value)">
      <button class="exp-del" onclick="delExp(${idx})" title="削除">×</button>
    </div>`
  ).join('');
  renderExpTotal(); renderMoneyView();
}
function renderExpTotal() {
  const el = document.getElementById('exp-total');
  if (el) el.textContent = '¥' + moneyTotal(selDate).toLocaleString();
}
function renderMoneyView() {
  const el = document.getElementById('money-view');
  if (!el || !selDate) return;
  const m = moneyOf(selDate);
  el.innerHTML = Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k =>
    `<span class="mv-chip">${esc(catDisplay(k))} ¥${m[k].toLocaleString()}</span>`).join('');
}

/* ── 保存 ── */
function saveDay() {
  if (!selDate) return;
  const e = entry(selDate);
  const memo = document.getElementById('d-memo');
  const mood = document.getElementById('d-mood');
  if (memo) e.memo = memo.value;
  if (mood) e.mood = parseFloat(mood.value)||60;
  save();
  const btn = document.getElementById('s-btn');
  if (btn) { btn.textContent='✓ 保存しました'; btn.classList.add('ok'); setTimeout(()=>{btn.innerHTML='<i class="ti ti-device-floppy"></i> 保存';btn.classList.remove('ok');},2000); }
  renderCal(); renderWeek();
}

function save() {
  DB.__updatedAt = Date.now();
  localStorage.setItem('cal_v2', JSON.stringify(DB));
  syncWeekly();
}

function syncWeekly() {
  if (!selDate) return;
  const dates = weekDates(selDate);
  const d = new Date(selDate+'T12:00:00');
  const jan1 = new Date(d.getFullYear(),0,1);
  const wk = Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
  const wkey = `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
  let w = {}; try{ w=JSON.parse(localStorage.getItem('needs_tracker_v2')||'{}'); }catch(e){}
  if(!w[wkey]) w[wkey]={needs:{},catTimes:{},catMoney:{}};
  const ct={},cm={};
  CATS.forEach(c=>{ct[c.id]=0;cm[c.id]=0;});
  dates.forEach(dd=>{
    const t=times(dd), m=moneyOf(dd);
    CATS.forEach(c=>{ct[c.id]+=(t[c.id]||0);cm[c.id]+=(m[c.id]||0);});
  });
  w[wkey].catTimes=ct; w[wkey].catMoney=cm;
  localStorage.setItem('needs_tracker_v2',JSON.stringify(w));
}

/* ── サマリーチップ ── */
function renderSummary() {
  if (!selDate) return;
  const t = times(selDate);
  const sum = document.getElementById('t-sum');
  sum.style.display = 'flex';
  sum.innerHTML = CATS.filter(c=>t[c.id]>0)
    .map(c=>`<span class="t-chip" style="background:${c.bg};color:${c.tc}">
      <span style="width:5px;height:5px;border-radius:50%;background:${c.color};display:inline-block"></span>${c.short} ${t[c.id]}h
    </span>`).join('') || '<span style="font-size:10px;color:var(--muted)">まだ割り当てなし</span>';
}

/* ── タイムライン描画 ── */
function renderTimeline() {
  if (!selDate) return;
  renderSummary();
  let html = '';
  for (let i = 0; i < SLOTS; i++) {
    html += slotRowHTML(i);
    if (editSlot === i) {
      const s = entry(selDate).slots[i];
      html += `<div class="note-row">
        <input class="note-inp" type="text" placeholder="メモ（任意）"
          value="${esc(s&&s.note||'')}"
          oninput="updateNote(${i},this.value)">
      </div>`;
    }
  }
  document.getElementById('tl-list').innerHTML = html;
}

/* ── フォーム（食事・支出・メモ）描画 ── */
function renderForms() {
  const e = entry(selDate);
  let html = '';

  // 食事ログ
  html += `<div class="meal-sec">
    <div class="sec-label"><i class="ti ti-tools-kitchen-2" style="font-size:11px"></i> 今日食べたもの</div>
    ${MEALS.map(m=>`<div class="meal-row">
      <div class="meal-lbl"><i class="ti ${m.icon}" style="font-size:11px"></i>${m.label}</div>
      <input class="meal-inp" type="text" placeholder="例）オートミール・卵・コーヒー" value="${esc(e.meals[m.id]||'')}" oninput="updMeal('${m.id}',this.value)">
    </div>`).join('')}
  </div>`;

  // 支出明細
  html += `<div class="money-sec">
    <div class="sec-label"><i class="ti ti-coin" style="font-size:11px"></i> 今日使ったお金<span class="tot" id="exp-total">¥0</span></div>
    <datalist id="exp-cat-list">${CATS.map(c=>`<option value="${esc(c.short)}">`).join('')}</datalist>
    <div id="exp-list"></div>
    <button class="add-btn" onclick="addExp()"><i class="ti ti-plus" style="font-size:11px"></i> 支出を追加</button>
    <div class="mv-wrap" id="money-view"></div>
  </div>`;

  // メモ・気分
  html += `<div class="memo-sec">
    <div class="sec-label"><i class="ti ti-pencil" style="font-size:11px"></i> 今日のひとこと</div>
    <textarea class="memo-ta" id="d-memo" placeholder="今日どうだった？">${esc(e.memo||'')}</textarea>
    <div class="mood-row">
      <span class="mood-lbl">気分</span>
      <input type="range" min="0" max="100" step="5" value="${e.mood||60}" id="d-mood"
        oninput="document.getElementById('d-moodval').textContent=this.value+'%'">
      <span class="mood-val" id="d-moodval">${e.mood||60}%</span>
    </div>
  </div>`;

  // 保存
  html += `<div class="save-area">
    <button class="save-btn" id="s-btn" onclick="saveDay()">
      <i class="ti ti-device-floppy"></i> 保存
    </button>
    <button class="link-btn" onclick="window.open('needs_tracker.html','_blank')">
      <i class="ti ti-external-link"></i> 週次チェックツールを開く
    </button>
  </div>`;

  document.getElementById('forms').innerHTML = html;
  renderExpList();
}

/* ── カレンダー描画 ── */
function renderCal() {
  document.getElementById('cal-title').textContent = `${vy}年${vm+1}月`;
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const first = new Date(vy,vm,1), last = new Date(vy,vm+1,0);
  const cells = [];
  for(let i=0;i<first.getDay();i++) cells.push({d:new Date(vy,vm,1-first.getDay()+i),cur:false});
  for(let d=1;d<=last.getDate();d++) cells.push({d:new Date(vy,vm,d),cur:true});
  const rem=7-(cells.length%7); if(rem<7) for(let i=1;i<=rem;i++) cells.push({d:new Date(vy,vm+1,i),cur:false});

  cells.forEach(({d,cur})=>{
    const key = dk(d.getFullYear(),d.getMonth(),d.getDate());
    const isT = d.toDateString()===TODAY.toDateString();
    const isSel = selDate===key;
    const dow = d.getDay();
    const cell = document.createElement('div');
    cell.className = 'cal-cell'+(cur?'':' om')+(isT?' td':'')+(isSel?' sel':'')+(dow===0?' sun':'')+(dow===6?' sat':'');
    const dd = document.createElement('div'); dd.className='cal-date'; dd.textContent=d.getDate();
    cell.appendChild(dd);
    if (cur && DB[key]) {
      const t = times(key);
      const total = Object.values(t).reduce((a,b)=>a+b,0);
      const money = moneyTotal(key);
      if (hasMeal(key)) { const mi=document.createElement('div');mi.className='cal-meal';mi.innerHTML='<i class="ti ti-tools-kitchen-2"></i>';cell.appendChild(mi); }
      if (money>0) { const m=document.createElement('div');m.className='cal-money';m.textContent='¥'+money.toLocaleString();cell.appendChild(m); }
      if (total>0) {
        const bar = document.createElement('div'); bar.className='cal-bar-row';
        CATS.forEach(c=>{ if(t[c.id]>0){ const seg=document.createElement('div');seg.className='cal-bar-seg';seg.style.background=c.color;seg.style.flex=t[c.id];bar.appendChild(seg); } });
        cell.appendChild(bar);
      }
    }
    if (cur) cell.onclick = () => selectDate(key);
    grid.appendChild(cell);
  });
}

function selectDate(key) {
  selDate = key; editSlot = null;
  renderCal();
  const [y,m,d] = key.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  const dow = ['日','月','火','水','木','金','土'][dt.getDay()];
  const isT = dt.toDateString()===TODAY.toDateString();
  document.getElementById('day-bar').innerHTML =
    `<div class="day-bar-date"><i class="ti ti-calendar-check"></i>${y}年${m}月${d}日（${dow}）${isT?'<span class="today-chip">今日</span>':''}</div>`;
  document.getElementById('cat-sel').style.display = 'block';
  const emp = document.getElementById('tl-empty'); if (emp) emp.style.display = 'none';
  renderTimeline();
  renderForms();
  renderWeek();
}

function renderWeek() {
  if (!selDate) return;
  const dates = weekDates(selDate);
  const timeTotals = CATS.map(c => {
    let time=0;
    dates.forEach(dd=>{ time+=(times(dd)[c.id]||0); });
    return {c,time};
  });
  const maxT = Math.max(...timeTotals.map(t=>t.time),1);

  const moneyByCat = {};
  dates.forEach(dd=>{ const m=moneyOf(dd); Object.keys(m).forEach(k=>{ moneyByCat[k]=(moneyByCat[k]||0)+m[k]; }); });
  const wTotal = Object.values(moneyByCat).reduce((a,b)=>a+b,0);
  const moneyKeys = Object.keys(moneyByCat).sort((a,b)=>moneyByCat[b]-moneyByCat[a]);

  document.getElementById('wk-bars').innerHTML = timeTotals.map(({c,time})=>
    `<div class="wk-row">
      <div class="wk-dot" style="background:${c.color}"></div>
      <div class="wk-lbl" title="${esc(c.label)}">${c.short}</div>
      <div class="wk-track"><div class="wk-fill" style="width:${Math.round(time/maxT*100)}%;background:${c.color}"></div></div>
      <div class="wk-val">${time}h</div>
    </div>`
  ).join('') +
  (moneyKeys.length ? `<div class="wk-row" style="margin-top:10px;padding-top:9px;border-top:.5px solid var(--bd)">
      <div class="wk-lbl" style="width:auto;font-weight:500;font-size:11px">週の支出内訳</div>
    </div>` + moneyKeys.map(k=>
      `<div class="wk-row">
        <div class="wk-lbl" style="width:auto;flex:1" title="${esc(catDisplay(k))}">${esc(catDisplay(k))}</div>
        <div class="wk-val" style="min-width:auto">¥${moneyByCat[k].toLocaleString()}</div>
      </div>`).join('') : '') +
  `<div class="wk-row" style="margin-top:8px;padding-top:7px;border-top:.5px solid var(--bd)">
      <div class="wk-lbl" style="width:auto;font-weight:500">週の支出合計</div>
      <div class="wk-val" style="flex:1;color:var(--teal);font-weight:600">¥${wTotal.toLocaleString()}</div>
    </div>`;
}

function changeMonth(d) {
  vm+=d; if(vm<0){vm=11;vy--;} if(vm>11){vm=0;vy++;} renderCal();
}
function goToday() {
  vy=TODAY.getFullYear(); vm=TODAY.getMonth();
  selectDate(dk(vy,vm,TODAY.getDate()));
}

buildCatGrid();
bindPaint();
setActiveCat('sleep');
goToday();
</script>

if ('serviceWorker' in navigator) {

  });
}
function toggleSyncPanel() {

}

<script type="module">
import { firebaseConfig } from './firebase-config.js';

const dotEl = document.getElementById('sy-dot');
const textEl = document.getElementById('sy-status-text');
const msgEl = document.getElementById('sy-msg');
const emailEl = document.getElementById('sy-email');
const pwEl = document.getElementById('sy-pw');
const signoutBtn = document.getElementById('sy-signout');
const signinBtn = document.getElementById('sy-signin-btn');
const signupBtn = document.getElementById('sy-signup-btn');

function setStatus(mode, extra) {
  dotEl.className = 'sy-dot' + (mode === 'synced' ? ' ok' : mode === 'connecting' ? ' warn' : mode === 'error' ? ' err' : '');
  const map = {
    nocfg: 'この端末のみに保存（クラウド未設定）',
    signedout: 'ログインすると他の端末と同期できます',
    connecting: '同期中…',
    synced: extra ? `同期済み（${extra}）` : '同期済み',
    error: '同期エラー（保存はローカルに残っています）',
  };
  textEl.textContent = map[mode] || '';
}
function setMsg(text, cls) {
  msgEl.textContent = text || '';
  msgEl.className = 'sy-msg' + (cls ? ' ' + cls : '');
}
function keyCount(obj) {
  return Object.keys(obj || {}).filter(k => k !== '__updatedAt').length;
}

if (!firebaseConfig || !firebaseConfig.apiKey) {
  setStatus('nocfg');
  emailEl.disabled = pwEl.disabled = true;
  signinBtn.disabled = signupBtn.disabled = true;
  setMsg('「セットアップ手順.md」を見てFirebaseを設定すると、他の端末と自動同期できます。');
} else {
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js');
    const { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } =
      await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js');
    const { getFirestore, doc, getDoc, setDoc, onSnapshot } =
      await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let unsub = null;
    let pushTimer = null;
    let applyingRemote = false;

    function docRef(uid) { return doc(db, 'users', uid, 'appdata', 'calendar'); }

    function debouncedPush() {
      if (applyingRemote || !auth.currentUser) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => { pushNow().catch(e => { console.error(e); setStatus('error'); }); }, 1200);
    }

    async function pushNow() {
      const user = auth.currentUser;
      if (!user) return;
      window.DB.__updatedAt = Date.now();
      localStorage.setItem('cal_v2', JSON.stringify(window.DB));
      await setDoc(docRef(user.uid), { json: JSON.stringify(window.DB), updatedAt: window.DB.__updatedAt });
      setStatus('synced', user.email);
    }

    function mergeRemote(data) {
      if (!data || !data.json) return;
      let remote;
      try { remote = JSON.parse(data.json); } catch (e) { return; }
      const remoteTs = data.updatedAt || 0;
      const localTs = window.DB.__updatedAt || 0;
      // 空のリモートで既存のローカルデータを誤って上書きしない安全策
      if (keyCount(remote) === 0 && keyCount(window.DB) > 0) return;
      if (remoteTs > localTs) {
        applyingRemote = true;
        window.DB = remote;
        window.DB.__updatedAt = remoteTs;
        localStorage.setItem('cal_v2', JSON.stringify(window.DB));
        window.renderCal && window.renderCal();
        window.renderWeek && window.renderWeek();
        if (window.selDate) { window.renderTimeline && window.renderTimeline(); window.renderForms && window.renderForms(); }
        applyingRemote = false;
      }
    }

    // save() をラップしてクラウドへも反映
    const origSave = window.save;
    window.save = function () { origSave(); debouncedPush(); };

    onAuthStateChanged(auth, (user) => {
      if (unsub) { unsub(); unsub = null; }
      if (user) {
        signoutBtn.style.display = 'block';
        signinBtn.style.display = signupBtn.style.display = 'none';
        emailEl.style.display = pwEl.style.display = 'none';
        setStatus('connecting');
        setMsg(`${user.email} でログイン中`, 'ok');
        getDoc(docRef(user.uid)).then((snap) => {
          if (snap.exists()) {
            mergeRemote(snap.data());
          } else {
            pushNow().catch(() => {});
          }
          unsub = onSnapshot(docRef(user.uid), (s) => { if (s.exists()) mergeRemote(s.data()); });
          setStatus('synced', user.email);
        }).catch((e) => { console.error(e); setStatus('error'); });
      } else {
        signoutBtn.style.display = 'none';
        signinBtn.style.display = signupBtn.style.display = 'inline-block';
        emailEl.style.display = pwEl.style.display = 'block';
        setStatus('signedout');
      }
    });

    window.doSignIn = async function () {
      setMsg('');
      try {
        await signInWithEmailAndPassword(auth, emailEl.value.trim(), pwEl.value);
        pwEl.value = '';
      } catch (e) { setMsg(jpAuthError(e), 'err'); }
    };
    window.doSignUp = async function () {
      setMsg('');
      try {
        await createUserWithEmailAndPassword(auth, emailEl.value.trim(), pwEl.value);
        pwEl.value = '';
        setMsg('登録できました。もう一方の端末では同じメール・パスワードでログインしてください。', 'ok');
      } catch (e) { setMsg(jpAuthError(e), 'err'); }
    };
    window.doSignOut = async function () {
      await signOut(auth);
      setMsg('ログアウトしました');
    };

    function jpAuthError(e) {
      const c = (e && e.code) || '';
      if (c.includes('email-already-in-use')) return 'このメールは登録済みです。ログインしてください。';
      if (c.includes('invalid-email')) return 'メールアドレスの形式が正しくありません。';
      if (c.includes('weak-password')) return 'パスワードは6文字以上にしてください。';
      if (c.includes('wrong-password') || c.includes('invalid-credential')) return 'メールまたはパスワードが違います。';
      if (c.includes('user-not-found')) return 'アカウントが見つかりません。新規登録してください。';
      if (c.includes('network-request-failed')) return '通信エラーです。電波状況を確認してください。';
      if (c.includes('too-many-requests')) return '試行回数が多すぎます。しばらくしてからお試しください。';
      return '同期エラー: ' + c;
    }
  } catch (e) {
    console.error(e);
    setStatus('error');
    setMsg('Firebaseの読み込みに失敗しました。設定値を確認してください。', 'err');
  }
}
</script>
</body>
</html>
